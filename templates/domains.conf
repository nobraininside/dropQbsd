# ==========================================================
#  dropQbsd -- domains.conf
#
#  THE PORTABLE SECURITY POLICY.
#  Describes intent, not syntax.
#
#  Policy model (default deny, allowlist):
#    - block all globally
#    - "allow" entries are the ONLY things permitted
#    - "deny = rfc1918|localhost" emits explicit blocks
#      that reinforce generic allows (always first)
#    - "deny = internet" is a FILTER: it strips any allow
#      targeting the internet, leaving only specific targets
#    - "deny = any" annihilates all allows (== network=deny)
#    - "allow_in" emits pass-in rules (for inbound services)
#
#  KNOWN LIMITATION:
#    The "deny" keyword accepts only the fixed set
#    rfc1918|localhost|internet|any -- not proto:port@target.
#    A rule like "allow = udp:53@any" therefore also permits
#    DNS toward RFC1918 addresses. If you need to block that,
#    add an explicit rule to the generated pf.conf (or extend
#    this script to accept proto:port@target in "deny").
#
#  IMPORTANT:
#    - This file is IDENTICAL on every installation.
#    - Do NOT modify it for personal needs: use [extra.*]
#      in local.conf for that.
#    - It is read by gen_fwall together with local.conf.
#
#  Path: /etc/dropQbsd/domains.conf
#  Permissions: root:wheel 644
# ==========================================================

[default]
policy = deny

[user]
role = conductor
network = deny

[userweb]
role = browser
allow = tcp:80@internet tcp:443@internet
allow = udp:53@any tcp:53@any
deny = rfc1918 localhost

[usermail]
role = mail
allow = tcp:25@table:mailserver tcp:143@table:mailserver tcp:465@table:mailserver tcp:587@table:mailserver tcp:993@table:mailserver tcp:995@table:mailserver
allow = udp:53@any tcp:53@any
deny = internet

[userdoc]
role = documents
# The catch-all LAN rules below are commented out: the policy
# lists only the specific services userdoc needs. Uncomment
# (or add rules) if you need broader LAN access.
# allow = tcp:any@lan udp:any@lan
allow = tcp:22000@lan udp:21027@lan
allow = tcp:3315@lan
allow = udp:53@any tcp:53@any
allow_in = tcp:22000@lan
allow_in = udp:21027@lan
deny = internet
